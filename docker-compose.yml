services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: eye-of-god-backend
    container_name: eye-of-god-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - eye-of-god-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: eye-of-god-frontend
    container_name: eye-of-god-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - eye-of-god-net

networks:
  eye-of-god-net:
    driver: bridge
